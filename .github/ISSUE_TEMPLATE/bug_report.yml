name: Bug report
description: Report a problem with freeauth
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets here. Report security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - mongoose
        - prisma
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit SHA or version you tested.
    validations:
      required: true
