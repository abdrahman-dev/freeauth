name: Task
description: Track a planned piece of work
title: "[Task]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: List the conditions that make this task complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / links
      description: Related issues, PRs, docs, or background.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - adapters
        - frontend
        - docs
        - testing
        - mobile
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
